<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%tylix.title%</title>
  <meta name="description" content="Ashmif Office Solutions builds and supports software for East African businesses: Payroflix, Rekoncile, MediSynq, Ashmif SMS, SmartRealtors and SmartFreight, plus custom web and mobile apps.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#020617">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme-boot.js"></script>
  <script src="/reveal.js" defer></script>

  <!-- Ashmif start-up screen (replaces Tylix's built-in one, which is off
       in tylix.config.ts). Flat colour only. Fallback colours are used
       until public/tailwind.css has loaded. -->
  <style>
    #aos-boot{--b-bg:var(--tx-canvas,250 249 246);--b-base:var(--tx-line,229 226 218);--b-brand:var(--tx-brand,11 133 98);--b-muted:var(--tx-muted,104 109 120);--b-saffron:245 181 68;position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;background:rgb(var(--b-bg));opacity:0;animation:aosb-in .25s ease .15s forwards;transition:opacity .35s ease,visibility .35s ease}
    html.dark #aos-boot{--b-bg:var(--tx-canvas,7 9 13);--b-brand:var(--tx-brand,24 193 146);--b-base:var(--tx-line,30 35 46);--b-muted:var(--tx-muted,140 148 163)}
    #aos-boot.aos-boot-done{opacity:0!important;visibility:hidden;animation:none}
    #aos-boot.aos-boot-done .aosb-inner{transform:scale(.96)}
    #aos-boot .aosb-inner{display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .35s ease}
    #aos-boot .aosb-mark{position:relative;width:60px;aspect-ratio:508/512}
    #aos-boot .aosb-mark i{position:absolute;inset:0;-webkit-mask:url(/brand/aos-mark.png) center/contain no-repeat;mask:url(/brand/aos-mark.png) center/contain no-repeat}
    #aos-boot .aosb-base{background:rgb(var(--b-base))}
    #aos-boot .aosb-fill{background:rgb(var(--b-brand));animation:aosb-rise 1.8s cubic-bezier(.65,0,.35,1) infinite}
    #aos-boot .aosb-track{position:relative;width:132px;height:3px;border-radius:3px;overflow:hidden;background:rgb(var(--b-base))}
    #aos-boot .aosb-bar{position:absolute;inset:0 auto 0 0;width:38%;border-radius:3px;background:rgb(var(--b-brand));animation:aosb-slide 1.1s cubic-bezier(.65,0,.35,1) infinite}
    #aos-boot .aosb-label{font:500 11px/1 "Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--b-muted));display:flex;align-items:center;gap:6px}
    #aos-boot .aosb-caret{width:6px;height:11px;background:rgb(var(--b-saffron));animation:aosb-blink 1s steps(1) infinite}
    #aos-boot .aosb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @keyframes aosb-in{to{opacity:1}}
    @keyframes aosb-rise{0%{clip-path:inset(100% 0 0 0)}45%,62%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 100% 0)}}
    @keyframes aosb-slide{from{transform:translateX(-100%)}to{transform:translateX(265%)}}
    @keyframes aosb-blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){#aos-boot .aosb-fill{animation:none;clip-path:none}#aos-boot .aosb-bar{animation:none;width:100%;opacity:.5}#aos-boot .aosb-caret{animation:none}}
  </style>

  %tylix.head%
</head>
<body>
  <div id="aos-boot" role="status" aria-live="polite">
    <div class="aosb-inner">
      <div class="aosb-mark" aria-hidden="true"><i class="aosb-base"></i><i class="aosb-fill"></i></div>
      <div class="aosb-track" aria-hidden="true"><div class="aosb-bar"></div></div>
      <div class="aosb-label" aria-hidden="true">ashmif.com<span class="aosb-caret"></span></div>
      <span class="aosb-sr">Loading Ashmif Office Solutions…</span>
    </div>
  </div>
  <script src="/loading-screen.js"></script>
  %tylix.body%
</body>
</html>
