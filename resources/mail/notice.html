<!-- Branded notice: tables and inline styles so it renders the same in
     Gmail, Outlook and Apple Mail. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef3f2;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #d9e4e1;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#020617;padding:22px 32px;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#18c192;"></span>
            <span style="font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#ffffff;padding-left:8px;">Ashmif Office Solutions</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px;">
            <h1 style="margin:0 0 10px;font-size:21px;line-height:28px;font-weight:700;color:#0b1220;">{{ heading }}</h1>
            <p style="margin:0 0 18px;font-size:14px;line-height:22px;color:#334155;">{{ intro }}</p>
            {{#if quote}}
            <div style="margin:0 0 18px;padding:14px 16px;background:#f3f8f6;border-left:3px solid #18c192;border-radius:8px;font-size:14px;line-height:22px;color:#0b1220;white-space:pre-wrap;">{{ quote }}</div>
            {{/if}}
            {{#each lines}}
            <p style="margin:0 0 6px;font-size:13px;line-height:20px;color:#475569;">{{ this.line }}</p>
            {{/each}}
            {{#if actionUrl}}
            <p style="margin:22px 0 0;"><a href="{{ actionUrl }}" style="display:inline-block;padding:11px 22px;background:#0e9f77;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:999px;">{{ actionLabel }}</a></p>
            {{/if}}
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 26px;">
            <p style="margin:0;font-size:12px;line-height:18px;color:#64748b;">{{ footnote }}</p>
            <p style="margin:10px 0 0;font-size:12px;line-height:18px;color:#94a3b8;">© {{ year }} Ashmif Office Solutions · Mombasa, Kenya · hello@ashmif.com</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
